<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>GREEN-API test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
            </svg>
          </span>
          <div class="brand-text">
            <h1 class="brand-title">GREEN-API</h1>
            <p class="brand-subtitle">Interface for testing WhatsApp API methods</p>
          </div>
        </div>

        <section class="card card-connection">
          <div class="connection-grid">
            <div class="field">
              <label class="label" for="idInstance">idInstance</label>
              <input type="text" class="input" placeholder="1101000001" id="idInstance" autocomplete="off" spellcheck="false" />
            </div>
            <div class="field">
              <label class="label" for="apiTokenInstance">apiTokenInstance</label>
              <input type="text" class="input" placeholder="d75b3a66374942c5b3c019c698abc2067e151558acbd4" id="apiTokenInstance" autocomplete="off" spellcheck="false" />
            </div>
            <div class="button-row connection-actions">
              <button type="button" class="button button-ghost" onclick="getSettings()">getSettings</button>
              <button type="button" class="button button-ghost" onclick="getStateInstance()">getStateInstance</button>
            </div>
          </div>
        </section>
      </header>

      <main class="main">
        <div class="panel">
          <section class="card">
            <div class="card-head">
              <h2 class="card-title">Send message</h2>
              <p class="card-hint">Text message to a phone number in international format</p>
            </div>
            <div class="field-grid">
              <div class="field">
                <label class="label" for="phoneNumber">Phone number</label>
                <input type="text" class="input" placeholder="79001234567" id="phoneNumber" autocomplete="off" inputmode="numeric" />
              </div>
              <div class="field">
                <label class="label" for="message">Message</label>
                <input type="text" class="input" placeholder="Hello from GREEN-API" id="message" autocomplete="off" />
              </div>
            </div>
            <div class="button-row">
              <button type="button" class="button" onclick="sendMessage()">sendMessage</button>
            </div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2 class="card-title">Send file by URL</h2>
              <p class="card-hint">Direct link to an image, document, audio or video</p>
            </div>
            <div class="field-grid">
              <div class="field">
                <label class="label" for="phoneNumber2">Phone number</label>
                <input type="text" class="input" placeholder="79001234567" id="phoneNumber2" autocomplete="off" inputmode="numeric" />
              </div>
              <div class="field">
                <label class="label" for="fileUrl">File url</label>
                <input type="text" class="input" placeholder="https://example.com/file.pdf" id="fileUrl" autocomplete="off" spellcheck="false" />
              </div>
            </div>
            <div class="button-row">
              <button type="button" class="button" onclick="sendFileByUrl()">sendFileByUrl</button>
            </div>
          </section>
        </div>

        <div class="output">
          <section class="card card-output">
            <div class="card-head output-head">
              <div>
                <h2 class="card-title">Response</h2>
                <p class="card-hint">Result of the last request</p>
              </div>
              <span class="badge">JSON</span>
            </div>
            <textarea class="textarea" id="outputContent" readonly placeholder="The server response will appear here"></textarea>
          </section>
        </div>
      </main>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
